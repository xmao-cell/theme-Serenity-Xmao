apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-Serenity-Xmao
spec:
  displayName: theme-Serenity-Xmao
  author:
    name: Xmao
    website: https://www.sitn.top
  description: 基于 Serenity 开发的 Halo 博客主题二次开发版本，详细内容请查看GitHub
  logo: /themes/theme-Serenity-Xmao/assets/public/logo.webp
  homepage: https://www.sitn.top
  repo: https://github.com/xmao-cell/theme-Serenity-Xmao.git
  issues: https://github.com/xmao-cell/theme-Serenity-Xmao/issues
  license:
    - name: GPL-3.0
      url: LICENSE
  settingName: theme-Serenity-Xmao-setting
  configMapName: theme-Serenity-Xmao-configmap
  version: 2.1.5
  requires: ">=2.0.0"
  customTemplates:
    page:
      - name: default
        description: 默认页面
        screenshot: 
        file: page.html
      - name: about
        description: 关于我
        screenshot: 
        file: about.html
      - name: moments
        description: 碎碎念
        screenshot: 
        file: moments.html
      - name: links
        description: 朋友们
        screenshot: 
        file: links.html
      - name: guestbook
        description: 留言板
        screenshot: 
        file: guestbook.html
      - name: projects
        description: 我的项目
        screenshot: 
        file: projects.html
      - name: friends-circle
        description: 朋友圈
        screenshot: 
        file: friends-circle.html
      - name: photos
        description: 图库
        screenshot: 
        file: photos.html
      - name: star-gallery
        description: 星图库
        screenshot: 
        file: star-gallery.html
      - name: wishes
        description: 便签墙
        screenshot: 
        file: wishes.html
      - name: equipments
        description: 我的装备
        screenshot: 
        file: equipments.html
    post:
      - name: default
        description: 默认文章
        screenshot: 
        file: post.html
    category:
      - name: default
        description: 默认分类
        screenshot: 
        file: category.html
    tag:
      - name: default
        description: 默认标签
        screenshot: 
        file: tag.html
